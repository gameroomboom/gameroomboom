<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Higher or Lower</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f0ff;--surface:#ffffff;--ink:#1b1740;--muted:#6a649a;--line:#ddd6f7;
  --up:#14b874;--down:#f0405a;--gold:#ffcf3f;--gold-ink:#1b1740;--shadow:0 6px 0 rgba(27,23,64,.12);
  --f:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1b1740;--surface:#262063;--ink:#fff7e8;--muted:#b3acd9;--line:#3b3490;
    --up:#3ddc97;--down:#ff5d73;--shadow:0 6px 0 rgba(0,0,0,.28);
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg);color:var(--ink);font-family:var(--f);font-weight:500;
  min-height:100vh;display:flex;justify-content:center;padding:32px 16px 48px;
}
main{width:100%;max-width:760px}
header{text-align:center;margin-bottom:28px}
h1{font-size:clamp(2.4rem,9vw,4.2rem);margin:0;font-weight:800;letter-spacing:-.03em;line-height:1}
h1 .u{color:var(--up)}h1 .d{color:var(--down)}
p.sub{margin:10px 0 0;color:var(--muted);font-size:1.05rem}
.hidden{display:none!important}

/* categories */
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:16px}
.cat{
  position:relative;text-align:left;background:var(--surface);color:var(--ink);
  border:3px solid var(--line);border-radius:20px;padding:20px 18px 16px;cursor:pointer;font:inherit;
  box-shadow:var(--shadow);overflow:hidden;
}
.cat::before{content:"";position:absolute;left:0;top:0;right:0;height:8px;background:var(--c)}
.cat .ic{
  width:52px;height:52px;border-radius:16px;background:var(--c);display:grid;place-items:center;
  font-size:1.7rem;margin-bottom:12px;
}
.cat b{display:block;font-size:1.25rem;font-weight:800;margin-bottom:4px}
.cat span{color:var(--muted);font-size:.95rem}
.cat small{display:block;margin-top:12px;font-weight:800;color:var(--ink)}
.cat:hover,.cat:focus-visible{border-color:var(--c);outline:none}
.cat:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(27,23,64,.12)}

/* game */
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:8px;flex-wrap:wrap}
.pill{background:var(--surface);border:3px solid var(--line);border-radius:999px;padding:6px 16px;font-weight:800}
.pill em{font-style:normal;color:var(--muted);font-weight:500;margin-right:6px}
.stats{display:flex;gap:10px}
.link{background:var(--surface);border:3px solid var(--line);border-radius:999px;color:var(--ink);cursor:pointer;font:inherit;font-weight:800;padding:6px 16px}
.link:hover,.link:focus-visible{border-color:var(--ink);outline:none}
.question{text-align:center;color:var(--muted);margin:0 0 16px;font-size:1.1rem}
.question b{color:var(--ink)}
.duel{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:16px}
.vs{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:2;
  width:56px;height:56px;border-radius:50%;background:var(--ink);color:var(--bg);
  display:grid;place-items:center;font-weight:800;border:4px solid var(--bg);
}
.card{
  border-radius:24px;padding:26px 14px;text-align:center;min-height:290px;
  display:flex;flex-direction:column;justify-content:center;align-items:center;gap:12px;
  box-shadow:var(--shadow);border:4px solid transparent;
}
.card.left{background:var(--gold);color:var(--gold-ink)}
.card.right{background:var(--surface);border-color:var(--line)}
.card .name{font-size:clamp(1.25rem,4.8vw,1.8rem);font-weight:800;line-height:1.1;letter-spacing:-.01em}
.card .value{font-size:clamp(2rem,8vw,3.2rem);font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.card .unit{font-size:.95rem;opacity:.75}
.card.right.correct{border-color:var(--up);background:color-mix(in srgb,var(--up) 18%,var(--surface))}
.card.right.wrong{border-color:var(--down);background:color-mix(in srgb,var(--down) 18%,var(--surface))}
.actions{display:flex;flex-direction:column;gap:12px;width:100%;max-width:220px}
.btn{
  background:var(--up);color:#0d2b1d;border:none;border-radius:14px;
  padding:14px;font:inherit;font-weight:800;font-size:1.1rem;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.2);
}
.btn.down{background:var(--down);color:#fff}
.btn.plain{background:var(--ink);color:var(--bg)}
.btn.ghost{background:transparent;color:var(--ink);border:3px solid var(--ink);box-shadow:none}
.btn:hover{filter:brightness(1.07)}
.btn:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.2)}
.msg{min-height:1.8em;margin:18px 0 0;font-weight:800;font-size:1.3rem;text-align:center}
.msg.good{color:var(--up)}.msg.bad{color:var(--down)}

/* game over */
.over{background:var(--surface);border:4px solid var(--line);border-radius:24px;padding:30px 18px;text-align:center;margin-top:14px;box-shadow:var(--shadow)}
.over h2{margin:0;font-size:1.7rem;font-weight:800}
.over .big{font-size:5rem;font-weight:800;line-height:1.1;color:var(--gold)}
.over .row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:20px}
.over .btn{padding:12px 22px}

@media (max-width:520px){
  .duel{gap:10px}.card{padding:18px 8px;min-height:250px}.vs{width:44px;height:44px;font-size:.9rem}
  .actions{max-width:100%}.btn{font-size:1rem;padding:12px 6px}
}
@media (prefers-reduced-motion:no-preference){
  .card.right.correct,.card.right.wrong{animation:pop .35s ease-out}
  .card.left{animation:slide .35s ease-out}
  @keyframes pop{0%{transform:scale(.96)}60%{transform:scale(1.03)}100%{transform:scale(1)}}
  @keyframes slide{from{transform:translateX(24px);opacity:.4}to{transform:none;opacity:1}}
}

.mute{position:fixed;top:12px;right:12px;z-index:5;font-size:1.1rem;padding:6px 12px}
#fx{position:fixed;inset:0;pointer-events:none;z-index:10}
.plus{position:fixed;z-index:11;font-weight:800;font-size:2rem;color:var(--up);pointer-events:none;transform:translate(-50%,-50%)}
.bump{display:inline-block}
@media (prefers-reduced-motion:no-preference){
  .plus{animation:rise .9s ease-out forwards}
  @keyframes rise{from{opacity:1;transform:translate(-50%,-50%) scale(.7)}to{opacity:0;transform:translate(-50%,-150px) scale(1.4)}}
  .duel.shake{animation:shake .45s}
  @keyframes shake{10%,90%{transform:translateX(-4px)}20%,80%{transform:translateX(8px)}30%,50%,70%{transform:translateX(-12px)}40%,60%{transform:translateX(12px)}}
  .pill.bump{animation:bump .35s}
  @keyframes bump{50%{transform:scale(1.25)}}
  .vs.hit{animation:spin .5s}
  @keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
  body.flash-bad::after,body.flash-good::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:9;animation:flash .5s ease-out forwards}
  body.flash-bad::after{box-shadow:inset 0 0 120px 30px var(--down)}
  body.flash-good::after{box-shadow:inset 0 0 120px 30px var(--up)}
  @keyframes flash{from{opacity:.85}to{opacity:0}}
}
</style>
</head>
<body>
<button class="link mute" id="mute" aria-label="Toggle sound">&#128266;</button>
<canvas id="fx" aria-hidden="true"></canvas>
<main>
  <header>
    <h1><span class="u">&#9650;</span> Higher or lower <span class="d">&#9660;</span></h1>
    <p class="sub" id="sub">Pick a category to start.</p>
  </header>

  <!-- Category picker -->
  <section id="menu">
    <div class="cats" id="cats"></div>
  </section>

  <!-- Game -->
  <section id="game" class="hidden">
    <div class="bar">
      <button class="link" id="back">&larr; Categories</button>
      <div class="stats"><span class="pill" id="scorePill"><em>Score</em><span id="score">0</span></span><span class="pill"><em>Best</em><span id="best">0</span></span></div>
    </div>
    <p class="question" id="question"></p>
    <div class="duel">
      <div class="vs" id="vs" aria-hidden="true">VS</div>
      <div class="card left" id="leftCard">
        <div class="name" id="leftName"></div>
        <div class="value" id="leftValue"></div>
        <div class="unit" id="leftUnit"></div>
      </div>
      <div class="card right" id="rightCard">
        <div class="name" id="rightName"></div>
        <div class="value hidden" id="rightValue"></div>
        <div class="unit" id="rightUnit"></div>
        <div class="actions" id="actions">
          <button class="btn" id="higher">&#9650; Higher</button>
          <button class="btn down" id="lower">&#9660; Lower</button>
        </div>
      </div>
    </div>
    <p class="msg" id="msg" aria-live="polite"></p>
    <div class="over hidden" id="over">
      <h2>Game over</h2>
      <div class="big" id="finalScore">0</div>
      <div id="finalNote" style="color:var(--muted)"></div>
      <div class="row">
        <button class="btn plain" id="again">Play again</button>
        <button class="btn ghost" id="menuBtn">Change category</button>
      </div>
    </div>
  </section>
</main>

<script>
/* ===== EDIT YOUR CATEGORIES HERE =====
   Add a new category by adding another object. Each item is [name, value]. */
const CATEGORIES = [
  { id:"population", title:"Country population", desc:"Which country has more people?",
    question:"Does it have a higher or lower population than", unit:"million people",
    items:[["China",1410],["India",1430],["United States",340],["Indonesia",278],["Pakistan",240],["Nigeria",224],["Brazil",216],["Bangladesh",173],["Russia",144],["Ethiopia",126],["Mexico",129],["Japan",124],["Egypt",112],["Turkey",85],["Germany",84],["United Kingdom",68],["France",68],["Italy",59],["Spain",48],["Argentina",46],["Poland",37],["Canada",40],["Australia",26],["Serbia",6.6]] },
  { id:"area", title:"Country size", desc:"Which country covers more land?",
    question:"Is its area higher or lower than", unit:"thousand km²",
    items:[["Russia",17098],["Canada",9985],["United States",9834],["China",9597],["Brazil",8516],["Australia",7692],["India",3287],["Argentina",2780],["Kazakhstan",2725],["Algeria",2382],["Mexico",1964],["Indonesia",1905],["Egypt",1002],["Turkey",784],["Spain",506],["France",644],["Japan",378],["Germany",358],["Poland",313],["Italy",301],["United Kingdom",244],["Serbia",88]] },
  { id:"mountains", title:"Mountain height", desc:"Which peak climbs higher?",
    question:"Is it higher or lower than", unit:"metres",
    items:[["Mount Everest",8849],["K2",8611],["Kangchenjunga",8586],["Lhotse",8516],["Makalu",8485],["Aconcagua",6961],["Denali",6190],["Mount Elbrus",5642],["Kilimanjaro",5895],["Mont Blanc",4806],["Matterhorn",4478],["Mount Etna",3357],["Mount Fuji",3776],["Mount Olympus",2918],["Triglav",2864],["Ben Nevis",1345]] },
  { id:"speed", title:"Animal speed", desc:"Which animal is faster?",
    question:"Is its top speed higher or lower than", unit:"km/h",
    items:[["Peregrine falcon (diving)",389],["Cheetah",110],["Sailfish",110],["Horse",88],["Pronghorn",88],["Lion",80],["Greyhound",72],["Ostrich",70],["Kangaroo",70],["Zebra",65],["Giraffe",60],["Rabbit",56],["Domestic cat",48],["Usain Bolt",44],["Elephant",40],["Hippo",30]] },
  { id:"planets", title:"Planet and moon size", desc:"Which world is wider?",
    question:"Is its diameter higher or lower than", unit:"km across",
    items:[["Jupiter",139820],["Saturn",116460],["Uranus",50724],["Neptune",49244],["Earth",12742],["Venus",12104],["Mars",6779],["Mercury",4879],["The Moon",3474],["Pluto",2377]] }
];
/* ===================================== */

const LOOK = {population:["#ff6b9d","\uD83D\uDC65"],area:["#3ddc97","\uD83D\uDDFA\uFE0F"],mountains:["#5ec8ff","\uD83C\uDFD4\uFE0F"],speed:["#ffb347","\uD83D\uDC06"],planets:["#b28dff","\uD83E\uDE90"]};
const $ = id => document.getElementById(id);
/* ===== SOUND + VISUAL EFFECTS ===== */
const REDUCE = matchMedia("(prefers-reduced-motion: reduce)").matches;
let ac = null, muted = false;
try{ muted = localStorage.getItem("hol_muted") === "1"; }catch(e){}
function paintMute(){ $("mute").innerHTML = muted ? "&#128263;" : "&#128266;"; }
$("mute").onclick = () => { muted = !muted; try{ localStorage.setItem("hol_muted", muted?"1":"0"); }catch(e){} paintMute(); sfx("click"); };
paintMute();

function tone(f,t0,d,type,v){
  const t = ac.currentTime + t0, o = ac.createOscillator(), g = ac.createGain();
  o.type = type || "square"; o.frequency.setValueAtTime(f,t);
  g.gain.setValueAtTime(v || .08,t); g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+d+.02);
}
function sfx(name,arg){
  if(muted) return;
  try{ ac = ac || new (window.AudioContext || window.webkitAudioContext)(); if(ac.state === "suspended") ac.resume(); }catch(e){ return; }
  if(name === "click") tone(520,0,.08,"triangle",.1);
  else if(name === "tick") tone(280 + arg*600,0,.04,"square",.04);
  else if(name === "win") [523,659,784,1047].forEach((f,i)=>tone(f,i*.07,.2,"triangle",.12));
  else if(name === "lose"){ tone(220,0,.25,"sawtooth",.09); tone(165,.2,.3,"sawtooth",.09); tone(110,.42,.5,"sawtooth",.09); }
  else if(name === "best") [523,659,784,659,784,1047,1319].forEach((f,i)=>tone(f,i*.1,.28,"square",.07));
}

const cv = $("fx"), cx = cv.getContext("2d");
let parts = [], raf = 0;
function fit(){ cv.width = innerWidth; cv.height = innerHeight; }
addEventListener("resize",fit); fit();
function confetti(n,ox,oy){
  if(REDUCE) return;
  const cols = ["#ffcf3f","#ff6b9d","#3ddc97","#5ec8ff","#b28dff","#ffb347"];
  for(let i=0;i<n;i++) parts.push({x:ox,y:oy,vx:(Math.random()-.5)*16,vy:-Math.random()*14-3,g:.38,s:6+Math.random()*7,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[i%cols.length],life:80+Math.random()*50});
  if(!raf) raf = requestAnimationFrame(loop);
}
function loop(){
  cx.clearRect(0,0,cv.width,cv.height);
  parts = parts.filter(p => p.life > 0 && p.y < cv.height + 40);
  parts.forEach(p=>{
    p.vy += p.g; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life--;
    cx.save(); cx.translate(p.x,p.y); cx.rotate(p.r); cx.fillStyle = p.c; cx.globalAlpha = Math.min(1,p.life/30);
    cx.fillRect(-p.s/2,-p.s/3,p.s,p.s*.6); cx.restore();
  });
  raf = parts.length ? requestAnimationFrame(loop) : (cx.clearRect(0,0,cv.width,cv.height), 0);
}
function cardCenter(){ const r = $("rightCard").getBoundingClientRect(); return [r.left + r.width/2, r.top + r.height/2]; }
function flash(cls){ document.body.classList.remove("flash-good","flash-bad"); void document.body.offsetWidth; document.body.classList.add(cls); setTimeout(()=>document.body.classList.remove(cls),550); }
function floatPlus(){
  if(REDUCE) return;
  const [x,y] = cardCenter(), d = document.createElement("div");
  d.className = "plus"; d.textContent = "+1"; d.style.left = x+"px"; d.style.top = (y-60)+"px";
  document.body.appendChild(d); setTimeout(()=>d.remove(),950);
}
function countUp(el,target,ms,done){
  if(REDUCE){ el.textContent = fmt(target); done(); return; }
  const t0 = performance.now(), dec = target % 1 ? 1 : 0; let lastTick = 0;
  (function step(now){
    const k = Math.min(1,(now - t0)/ms), e = 1 - Math.pow(1-k,3);
    el.textContent = k < 1 ? (target*e).toLocaleString("en-US",{maximumFractionDigits:dec,minimumFractionDigits:dec}) : fmt(target);
    if(now - lastTick > 55 && k < 1){ sfx("tick",k); lastTick = now; }
    k < 1 ? requestAnimationFrame(step) : done();
  })(t0);
}
function bump(el){ el.classList.remove("bump"); void el.offsetWidth; el.classList.add("bump"); }
/* ================================== */

let cat = null, left = null, right = null, score = 0, locked = false, deck = [];

function loadBest(id){ try{ return +localStorage.getItem("hol_best_"+id) || 0 }catch(e){ return 0 } }
function saveBest(id,v){ try{ localStorage.setItem("hol_best_"+id, v) }catch(e){} }
const fmt = n => n.toLocaleString("en-US");

function buildMenu(){
  $("cats").innerHTML = "";
  CATEGORIES.forEach(c=>{
    const b = document.createElement("button");
    b.className = "cat";
    const l = LOOK[c.id] || ["#ffcf3f","\u2753"];
    b.style.setProperty("--c", l[0]);
    b.innerHTML = `<div class="ic">${l[1]}</div><b>${c.title}</b><span>${c.desc}</span><small>Best score: ${loadBest(c.id)}</small>`;
    b.onclick = () => { sfx("click"); start(c); };
    $("cats").appendChild(b);
  });
}

function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]} return a }

function nextItem(avoid){
  if(!deck.length) deck = shuffle(cat.items.slice());
  let i = deck.findIndex(x => x[1] !== avoid[1]);
  if(i < 0){ deck = shuffle(cat.items.slice()); i = deck.findIndex(x => x[1] !== avoid[1]); }
  return deck.splice(i,1)[0];
}

function start(c){
  cat = c; score = 0; locked = false;
  deck = shuffle(cat.items.slice());
  left = deck.pop();
  right = nextItem(left);
  $("menu").classList.add("hidden");
  $("game").classList.remove("hidden");
  $("sub").textContent = cat.title;
  render();
}

function render(){
  $("score").textContent = score;
  $("best").textContent = loadBest(cat.id);
  $("question").innerHTML = `${cat.question} <b></b>?`; $("question").querySelector("b").textContent = left[0];
  $("leftName").textContent = left[0];
  $("leftValue").textContent = fmt(left[1]);
  $("leftUnit").textContent = cat.unit;
  $("rightName").textContent = right[0];
  $("rightValue").classList.add("hidden");
  $("rightUnit").textContent = "";
  $("rightCard").className = "card right";
  $("actions").classList.remove("hidden");
  $("msg").textContent = ""; $("msg").className = "msg";
  $("over").classList.add("hidden");
  document.querySelector(".duel").classList.remove("shake");
  locked = false;
}

function guess(dir){
  if(locked) return;
  locked = true;
  sfx("click");
  const correct = dir === "higher" ? right[1] > left[1] : right[1] < left[1];
  $("rightValue").classList.remove("hidden");
  $("actions").classList.add("hidden");
  $("rightUnit").textContent = cat.unit;
  countUp($("rightValue"), right[1], 650, () => resolve(correct));
}

function resolve(correct){
  $("rightCard").classList.add(correct ? "correct" : "wrong");
  $("vs").classList.remove("hit"); void $("vs").offsetWidth; $("vs").classList.add("hit");
  const [cxp,cyp] = cardCenter();
  if(correct){
    score++;
    $("score").textContent = score; bump($("scorePill"));
    if(score > loadBest(cat.id)){ saveBest(cat.id, score); $("best").textContent = score; }
    sfx("win"); flash("flash-good"); floatPlus();
    confetti(40 + Math.min(score,10)*8, cxp, cyp);
    $("msg").textContent = score >= 3 ? "Correct! \uD83D\uDD25 " + score + " in a row" : "Correct! +1";
    $("msg").className = "msg good";
    setTimeout(()=>{ left = right; right = nextItem(left); render(); }, 1400);
  } else {
    sfx("lose"); flash("flash-bad");
    document.querySelector(".duel").classList.add("shake");
    $("msg").textContent = "Wrong."; $("msg").className = "msg bad";
    setTimeout(gameOver, 1200);
  }
}

function gameOver(){
  const newBest = score > 0 && score >= loadBest(cat.id);
  $("finalScore").textContent = score;
  $("finalNote").textContent = newBest ? "New best score! \uD83C\uDFC6" : `Best in this category: ${loadBest(cat.id)}`;
  $("over").classList.remove("hidden");
  if(newBest){ sfx("best"); confetti(160, innerWidth/2, innerHeight*.45); }
}

function toMenu(){
  $("game").classList.add("hidden");
  $("menu").classList.remove("hidden");
  $("sub").textContent = "Pick a category to start.";
  buildMenu();
}

$("higher").onclick = () => guess("higher");
$("lower").onclick = () => guess("lower");
$("again").onclick = () => { sfx("click"); start(cat); };
$("menuBtn").onclick = () => { sfx("click"); toMenu(); };
$("back").onclick = () => { sfx("click"); toMenu(); };
buildMenu();
</script>
</body>
</html>
