<style>

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-weight:500;min-height:100vh;padding:56px 16px 40px}
main{max-width:760px;margin:0 auto}
.hidden{display:none!important}
.top{position:absolute;left:16px;top:16px;font-weight:800;color:var(--muted);text-decoration:underline}

.sub{color:var(--muted);text-align:center;margin:0 auto 20px;max-width:46ch}
.bar{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:16px}
.pill{background:var(--surface);border:3px solid var(--line);border-radius:999px;padding:6px 16px;font-weight:800}

.btn.gold{background:var(--gold);color:#1b1740}
.btn.ghost{background:transparent;color:var(--ink);border:3px solid var(--ink);box-shadow:none;padding:9px 20px}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.btn:not(:disabled):active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.2)}
.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.botrow{display:flex;gap:14px;align-items:center;margin-bottom:18px}
.robot{width:110px;flex:none;overflow:visible}
.robot *{stroke:var(--ink)}
.bubble{position:relative;flex:1;background:var(--surface);border:4px solid var(--line);border-radius:20px;padding:16px 18px;font-size:1.25rem;font-weight:800;line-height:1.3;min-height:84px;box-shadow:var(--shadow)}
.bubble::before{content:"";position:absolute;left:-14px;top:34px;width:22px;height:22px;background:var(--surface);border-left:4px solid var(--line);border-bottom:4px solid var(--line);transform:rotate(45deg)}

.ov{position:absolute;inset:0;cursor:crosshair}

.robot{animation:bob 2.4s ease-in-out infinite alternate}

async function getModel(){
if(detector||model)return;
$("brain").textContent="Advanced…";
try{
const lib=await import("https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.7.2");
detector=await lib.pipeline("zero-shot-object-detection","Xenova/owlvit-base-patch32",{dtype:"q8"});

}catch(err){
console.warn("Advanced AI failed to load; trying fallback model.",err);

}
function iou(a,b){
const x1=Math.max(a[0],b[0]),y1=Math.max(a[1],b[1]),x2=Math.min(a[0]+a[2],b[0]+b[2]),y2=Math.min(a[1]+a[3],b[1]+b[3]);

return union?inter/union:0
}
function normaliseDetections(raw,img,P){
const area=img.naturalWidth*img.naturalHeight;
let ds=raw.map(d=>{if(d.box){const b=d.box;return{class:String(d.label||"object").toLowerCase(),score:d.score,bbox:[b.xmin,b.ymin,b.xmax-b.xmin,b.ymax-b.ymin]}}return d}).filter(d=>{

for(const d of ds){if(!unique.some(u=>u.class===d.class&&iou(u.bbox,d.bbox)>.58))unique.push(d)}

}
async function fetchImg(need,P){
await getModel();
for(let a=0;a<18;a++){
try{
const q=pick(QUERIES),off=Math.floor(Math.random()*120);

}
function rgbName(r,g,b){

if(t==="color"){
const names=colorGrid(img),cnt={};names.forEach(c=>cnt[c]=(cnt[c]||0)+1);
let opts=Object.keys(cnt).filter(c=>cnt[c]/names.length>.05&&cnt[c]/names.length<.4&&!NEUTRAL.includes(c));
if(!opts.length)opts=Object.keys(cnt).filter(c=>cnt[c]/names.length>.05&&cnt[c]/names.length<.5);
if(!opts.length)throw new Error("no color");
const col=pick(opts);let sx=0,sy=0,k=0;
names.forEach((c,i)=>{if(c===col){sx+=i%GW;sy+=Math.floor(i/GW);k++}});
const at=(x,y)=>names[Math.min(GH-1,Math.floor(y/H*GH))*GW+Math.min(GW-1,Math.floor(x/W*GW))];
return Object.assign(base,{text:"I spy with my little eye... something that is "+col+".",small:"Click on anything "+col+".",answer:"anything "+col,check:(x,y)=>at(x,y)===col,reveal:ov=>names.forEach((c,i)=>{if(c===col){const d=document.createElement("div");d.className="cell";d.style.left=(i%GW)/GW*100+"%";d.style.top=Math.floor(i/GW)/GH*100+"%";d.style.width=100/GW+"%";d.style.height=100/GH+"%";ov.appendChild(d)}}),hintList:["Look in the "+posName(sx/k/GW,sy/k/GH)+" of the picture.","It covers about "+Math.round(cnt[col]/names.length*100)+" percent of the picture."]})
}
const dets=f.dets,np=dets.filter(d=>d.class!=="person"),pool=np.length?np:dets;
if(t==="size"){
const sorted=dets.slice().sort((a,b)=>a.bbox[2]*a.bbox[3]-b.bbox[2]*b.bbox[3]),big=Math.random()<.5,tg=big?sorted[sorted.length-1]:sorted[0];
const cx=(tg.bbox[0]+tg.bbox[2]/2)/W,cy=(tg.bbox[1]+tg.bbox[3]/2)/H;
return Object.assign(base,{text:"I spy with my little eye... the "+(big?"BIGGEST":"SMALLEST")+" object the robot can detect.",small:"Click on it.",answer:"the "+tg.class,check:(x,y)=>inBox(tg,x,y,pad),reveal:ov=>addBoxes(ov,img,[tg]),hintList:["Look in the "+posName(cx,cy)+" of the picture.","It's mostly "+colorGrid(img,tg.bbox)+"."]})
}
const tg=pick(pool),L=tg.class[0].toUpperCase(),valid=dets.filter(d=>t==="name"?d.class===tg.class:d.class[0].toUpperCase()===L),cx=(tg.bbox[0]+tg.bbox[2]/2)/W,cy=(tg.bbox[1]+tg.bbox[3]/2)/H;
return Object.assign(base,{text:"I spy with my little eye... "+(t==="name"?"a "+tg.class+".":"an object beginning with "+L+"."),small:"Click on it in the picture.",answer:"the "+tg.class,check:(x,y)=>valid.some(d=>inBox(d,x,y,pad)),reveal:ov=>addBoxes(ov,img,valid),hintList:["It's mostly "+colorGrid(img,tg.bbox)+".","Look in the "+posName(cx,cy)+" of the picture.","Its name has "+tg.class.replace(/ /g,"").length+" letters."]})
}
async function buildPuzzle(n){
const P=params(n),order=[chooseType(n),"size","letter","name","color"].filter((v,i,a)=>a.indexOf(v)===i);
for(const t of order){try{const p=await tryType(t,P);p.n=n;return p}catch(e){}}
throw new Error("The robot couldn't find a good picture. Please try again.")
}
function paint(){$("score").textContent=score;$("streak").textContent=streak;$("best").textContent=best}
function setBusy(on){busy=on;$("hintBtn").disabled=on;$("skipBtn").disabled=on}
async function nextRound(){
$("err").textContent="";$("nextBtn").classList.add("hidden");$("skipBtn").classList.remove("hidden");cur=null;hintsUsed=0;resolved=true;paint();setBusy(true);
$("game").classList.remove("hidden");$("final").classList.add("hidden");$("credit").textContent="";$("stage").innerHTML='<div class="load">Spyro is searching for a tricky photo...</div>';
try{
const job=pending&&pending.n===n?pending.p:buildPuzzle(n);pending=null;
const p=await job;cur=p;resolved=false;$("stage").innerHTML="";$("stage").appendChild(p.img);
const ov=document.createElement("div");ov.className="ov";ov.id="ov";ov.onclick=clicked;$("stage").appendChild(ov);
$("credit").innerHTML='Photo from <a href="'+p.page+'" target="_blank" rel="noopener">Wikimedia Commons</a>';
$("hintBtn").classList.remove("hidden");$("hintBtn").disabled=false;say(p.text,p.small);paint();setBusy(false);
pending={n:n+1,p:buildPuzzle(n+1)};pending.p.catch(()=>{})
}catch(e){
$("stage").innerHTML="";$("err").textContent="Couldn't find a suitable photo just now. Try again.";say("My robot brain needs another search!");
$("nextBtn").textContent="Try again";$("nextBtn").classList.remove("hidden");$("skipBtn").classList.add("hidden");setBusy(false)
}
}
function mark(x,y,ok){
const m=document.createElement("div");m.className="mark "+(ok?"ok":"no");m.textContent=ok?"✓":"✕";m.style.left=x/cur.img.naturalWidth*100+"%";m.style.top=y/cur.img.naturalHeight*100+"%";$("ov").appendChild(m)
}
function endRound(){resolved=true;cur.reveal($("ov"));$("ov").style.pointerEvents="none";$("hintBtn").classList.add("hidden");$("skipBtn").classList.add("hidden");paint();$("nextBtn").textContent="Next picture";$("nextBtn").classList.remove("hidden")}
function win(){
const mult=Math.min(4,1+streak*.25),pts=Math.round(Math.max(3,12-hintsUsed*2)*mult);score+=pts;streak++;
if(score>best){best=score;try{localStorage.setItem("ispy_best",score)}catch(e){}}
sfx("ok");say(pick(["Great spot!","Correct! Nice observation.","You found it!","Sharp eyes!","Beep boop, that's right!"])+" +"+pts+" points"+(mult>1?" (streak bonus!)":""));endRound()
}
function lose(why){streak=0;sfx("no");say(why+". The target was "+cur.answer+". Take a closer look at the highlighted area, then keep going!");endRound()}
function clicked(e){
if(busy||!cur||resolved)return;
const r=$("ov").getBoundingClientRect(),x=(e.clientX-r.left)*cur.img.naturalWidth/r.width,y=(e.clientY-r.top)*cur.img.naturalHeight/r.height,hit=cur.check(x,y);mark(x,y,hit);
if(hit)return win();sfx("no");say(pick(["Not that one — keep looking!","Close, but not quite.","Try a different object.","Nope! Study the details."]))
}
function hint(){
if(busy||!cur||resolved)return;const list=cur.hintList;if(hintsUsed>=list.length)return;say("Clue: "+list[hintsUsed]);hintsUsed++;if(hintsUsed>=list.length)$("hintBtn").disabled=true
}
function giveUp(){if(busy||!cur||resolved)return;lose("Skipped")}
async function start(){
$("startBox").classList.add("hidden");$("final").classList.add("hidden");n=0;score=0;streak=0;pending=null;cur=null;$("err").textContent="";
say("Loading my smarter vision brain. The first download may take a while...");setBusy(true);paint();
try{await getModel()}catch(e){$("err").textContent=e.message;$("startBox").classList.remove("hidden");setBusy(false);return}
nextRound()
}
$("startBtn").onclick=start;$("again").onclick=start;$("nextBtn").onclick=()=>{n++;nextRound()};$("hintBtn").onclick=hint;$("skipBtn").onclick=giveUp;paint();
</script>
