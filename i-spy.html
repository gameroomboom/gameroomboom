
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>I Spy — Object Hunt AI</title>
<style>
:root{color-scheme:light dark;--bg:#f4f0ff;--panel:#fff;--ink:#1b1740;--muted:#6a649a;--line:#ddd6f7;--green:#14b874;--gold:#ffcf3f}
@media(prefers-color-scheme:dark){:root{--bg:#1b1740;--panel:#262063;--ink:#fff7e8;--muted:#b3acd9;--line:#3b3490}}
*{box-sizing:border-box}
body{margin:0;padding:48px 16px 36px;background:var(--bg);color:var(--ink);font:500 16px/1.45 system-ui,sans-serif}
main{max-width:800px;margin:auto}
h1{text-align:center;font-size:clamp(2.4rem,8vw,4rem);line-height:1;margin:10px 0}
p{text-align:center;color:var(--muted)}
.stats,.buttons{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap;margin:16px 0}
.pill,button{border:2px solid var(--line);border-radius:14px;padding:10px 16px;font:inherit;font-weight:750}
.pill{background:var(--panel)}
button{background:var(--green);color:#092c1d;border:0;cursor:pointer;box-shadow:0 4px 0 #0a7148}
button.secondary{background:var(--panel);color:var(--ink);border:2px solid var(--line);box-shadow:none}
button:disabled{opacity:.5;cursor:default}
.robotbox{display:flex;gap:12px;align-items:center;margin:18px 0}
.robot{font-size:3rem}
.bubble{flex:1;padding:16px;border:3px solid var(--line);border-radius:18px;background:var(--panel);font-weight:800;min-height:75px}
.bubble small{display:block;color:var(--muted);font-weight:500;margin-top:5px}
.stage{position:relative;min-height:220px;display:grid;place-items:center;background:var(--panel);border:3px solid var(--line);border-radius:18px;overflow:hidden}
.stage img{width:100%;height:auto;max-height:72vh;object-fit:contain;display:block}
.overlay{position:absolute;inset:0;cursor:crosshair}
.mark{position:absolute;transform:translate(-50%,-50%);font-size:25px;font-weight:900;color:white;text-shadow:0 1px 5px #000;pointer-events:none}
.box{position:absolute;border:3px solid var(--gold);border-radius:5px;pointer-events:none;box-shadow:0 0 0 1px #111}
.box span{position:absolute;top:-25px;left:-3px;padding:2px 6px;background:var(--gold);color:#111;font-size:12px;white-space:nowrap}
.credit{text-align:center;font-size:12px;margin-top:8px;color:var(--muted)}
.credit a{color:inherit}
.error{color:#c22;text-align:center;font-weight:700}
.hidden{display:none!important}
.load{padding:48px 16px;text-align:center;color:var(--muted);font-weight:800}
</style>
</head>
<body>
<main>
<h1>🔎 I Spy</h1>
<p>Find objects in real photos. Endless play, harder targets, and no timer.</p>

<div class="stats">
<span class="pill">Score: <b id="score">0</b></span>
<span class="pill">Streak: <b id="streak">0</b></span>
<span class="pill">Best: <b id="best">0</b></span>
<span class="pill">AI: <b id="brain">Not loaded</b></span>
</div>

<div class="robotbox">
<div class="robot">🤖</div>
<div class="bubble">
<span id="say">I'm Spyro. Let's find objects, not people!</span>
<small id="clue">Press Start to begin.</small>
</div>
</div>

<div id="startrow" class="buttons">
<button id="start">Start searching</button>
</div>

<div id="game" class="hidden">
<div id="stage" class="stage"><div class="load">Waiting…</div></div>
<div id="credit" class="credit"></div>
<div class="buttons">
<button id="hint" class="secondary">Hint</button>
<button id="skip" class="secondary">Skip picture</button>
<button id="next" class="hidden">Next picture</button>
</div>
</div>
<div id="err" class="error" role="alert"></div>
</main>

<script>
const $=id=>document.getElementById(id);
const pick=a=>a[Math.floor(Math.random()*a.length)];

const QUERIES=[
"close up still life tools on workbench no people",
"electronics components on repair bench no people",
"hardware store tools bolts screws close up",
"kitchen utensils on counter still life",
"messy desk stationery gadgets no people",
"garage tools equipment shelves empty",
"bicycle parts tools close up",
"industrial machine gears control panel",
"assorted objects arranged on table still life",
"colorful stationery pens rulers scissors",
"fruit and vegetables display close up",
"shelves with bottles jars products",
"woodworking tools on bench",
"camera equipment laid out on desk",
"camping gear arranged on ground",
"fishing tackle equipment close up",
"garden tools pots watering can",
"museum objects display case",
"antique clocks radios cameras collection",
"coins keys padlocks on table",
"board game pieces dice cards",
"toy cars and building blocks",
"spice jars kitchen counter",
"baking utensils and ingredients",
"bathroom bottles toiletries shelf",
"shoes and bags on rack",
"car engine parts on workbench",
"warehouse boxes pallets no workers",
"electrical cables switches circuit boards",
"musical instruments on display",
"paint brushes cans and rollers",
"plumbing pipes fittings tools",
"glass bottles and jars still life",
"book shelf objects clock vase",
"screws nuts washers assorted",
"mechanical gears bearings parts",
"computer components motherboard",
"hardware hand tools close up",
"industrial control panel switches",
"bike repair tools and parts",
"camping lantern rope compass",
"pottery and craft tools",
"plants pots and garden tools",
"restaurant table plates glasses cutlery",
"stationery clips stapler tape dispenser",
"tools in open tool cabinet",
"old typewriter and desk objects",
"bicycle wheel chain pedals close up",
"small household objects on tabletop",
"kitchen pans ladles whisk spatula"
];

const OBJECTS=[
"hammer","screwdriver","wrench","pliers","drill","scissors",
"tape measure","ruler","screw","bolt","nut","gear","bearing",
"pipe","wire","cable","circuit board","computer mouse",
"keyboard","monitor","phone","camera","headphones","speaker",
"clock","watch","calculator","book","notebook","pen","pencil",
"paintbrush","mug","cup","glass","bottle","jar","plate","bowl",
"spoon","fork","pot","pan","kettle","toaster","chair","table",
"lamp","vase","plant pot","flower","apple","banana","orange",
"bread","box","backpack","suitcase","shoe","helmet","bicycle",
"wheel","car","traffic cone","key","padlock","coin","toy car",
"ball","remote control","flashlight","battery","bucket",
"watering can","shovel","rake","hose","rope","chain","ladder",
"toolbox","shelf","drawer","basket","bin","umbrella","stapler",
"printer","router","power strip","plug","socket","light switch",
"thermometer","scale","frying pan","spice jar","cutting board",
"rolling pin","whisk","spray bottle","toothbrush","towel","comb",
"clamp","soldering iron","multimeter","game controller",
"microphone","guitar","paint roller","sponge","plastic container",
"rock","shell","fishing rod","anchor","pallet","shopping cart",
"cash register","mailbox","wheelbarrow","lawn mower",
"door handle","hinge","picture frame","mirror","candle",
"measuring cup","stool","control panel","valve","gauge",
"electric motor","pump","fan","radiator","car battery","tire",
"hubcap","license plate","brick","wood plank","faucet","sink",
"spray can","tin can","cardboard carton","milk carton",
"egg carton","cereal box","tomato","carrot","potato","onion",
"cucumber","mushroom","pumpkin","cactus","succulent","birdhouse",
"binoculars","telescope","magnifying glass","compass","globe",
"hourglass","chess piece","dice","playing card","puzzle piece",
"domino","building block","toy robot","model airplane",
"skateboard","tennis racket","basketball","whistle","stopwatch",
"radio","walkie-talkie","flash drive","hard drive","memory card",
"USB cable","charger","power bank","light bulb","fuse",
"circuit breaker","wire stripper","welding mask","safety goggles",
"tool belt","spirit level","chisel","mallet","wood clamp",
"socket wrench","ratchet","allen key","torque wrench","oil filter",
"spark plug","brake disc","car jack","air pump","bicycle pump",
"bike light","bike bell","bike pedal","bike saddle","bike chain",
"shopping basket","vending machine","locker","bench","streetlight",
"hydrant","parking meter","construction helmet","cement bag",
"tile","shower head","thermostat","smoke detector","glass jar",
"plastic bottle","cheese block","watermelon","pineapple","lemon",
"seed packet","bird feeder","yo-yo","metronome","vinyl record",
"adapter","extension cord","LED bulb","measuring tape","file tool",
"grease gun","oil can","funnel","wheel chock","reflector",
"rear light","front light","bell"
];

// These categories are excluded from targets and used to reject photos.
const PEOPLE=/^(person|people|human|face|man|woman|boy|girl|pedestrian|crowd|child|adult|worker|skier|surfer|rider|player|bride|groom)$/i;

let detector=null,fallback=null,mode="advanced";
let current=null,score=0,streak=0,best=0,hints=0,locked=true,round=0;

try{best=Number(localStorage.getItem("ispy-best"))||0}catch(e){}

const imgLoad=url=>new Promise((resolve,reject)=>{
const im=new Image();
im.crossOrigin="anonymous";
im.onload=()=>resolve(im);
im.onerror=reject;
im.src=url;
});

async function loadScript(src){
return new Promise((ok,no)=>{
const s=document.createElement("script");
s.src=src;s.onload=ok;s.onerror=no;
document.head.appendChild(s);
});
}

async function loadAI(){
if(detector||fallback)return;
$("brain").textContent="Loading…";
try{
const lib=await import("https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.7.2");
detector=await lib.pipeline(
"zero-shot-object-detection",
"Xenova/owlvit-base-patch32",
{dtype:"q8"}
);
mode="advanced";
$("brain").textContent="Advanced";
}catch(e){
console.warn("Advanced model unavailable; trying basic model.",e);
mode="basic";
if(!window.tf)await loadScript("https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js");
if(!window.cocoSsd)await loadScript("https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js");
fallback=await cocoSsd.load();
$("brain").textContent="Basic";
}
}

function iou(a,b){
const x=Math.max(0,Math.min(a[0]+a[2],b[0]+b[2])-Math.max(a[0],b[0]));
const y=Math.max(0,Math.min(a[1]+a[3],b[1]+b[3])-Math.max(a[1],b[1]));
const inter=x*y;
return inter/(a[2]*a[3]+b[2]*b[3]-inter||1);
}

function tidy(raw,img){
const area=img.naturalWidth*img.naturalHeight;
let ds=raw.map(d=>d.box?{
class:String(d.label||"object").toLowerCase(),
score:d.score,
bbox:[d.box.xmin,d.box.ymin,d.box.xmax-d.box.xmin,d.box.ymax-d.box.ymin]
}:d).filter(d=>{
if(!d.bbox)return false;
const ratio=d.bbox[2]*d.bbox[3]/area;
return d.score>(mode==="advanced"?.025:.38)&&ratio>.0015&&ratio<.86&&d.bbox[2]>8&&d.bbox[3]>8;
}).sort((a,b)=>b.score-a.score);

const out=[];
for(const d of ds){
if(!out.some(u=>u.class===d.class&&iou(u.bbox,d.bbox)>.55))out.push(d);
}
return out;
}

async function detect(img){
const labels=["person","people","pedestrian","crowd","human",...OBJECTS];
let raw=[];
if(detector){
raw=await detector(img,labels,{top_k:100,threshold:.025});
}else{
raw=await fallback.detect(img,80);
}
return tidy(raw,img);
}

async function getPhoto(){
await loadAI();

for(let tries=0;tries<25;tries++){
try{
const q=pick(QUERIES);
const url="https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrnamespace=6&gsrlimit=50&gsroffset="+Math.floor(Math.random()*60)+"&gsrsearch="+encodeURIComponent(q)+"&prop=imageinfo&iiprop=url|mime&iiurlwidth=1000";
const r=await fetch(url);
if(!r.ok)continue;

const data=await r.json();
const pages=Object.values(data.query?.pages||{}).filter(p=>{
const f=p.imageinfo?.[0];
const title=(p.title||"").toLowerCase();
return f?.mime==="image/jpeg"&&f.thumburl&&
!/portrait|headshot|selfie|family|people|crowd|person|human|wedding|fashion|model|actor|actress|drawing|diagram|logo|poster|screenshot/i.test(title);
});
if(!pages.length)continue;

const info=pick(pages).imageinfo[0];
const img=await imgLoad(info.thumburl);
const all=await detect(img);
const people=all.filter(d=>PEOPLE.test(d.class));
const objs=all.filter(d=>!PEOPLE.test(d.class));
const imageArea=img.naturalWidth*img.naturalHeight;

// Reject images when a person is detected. Never use a person as a fallback target.
const personLikely=people.some(d=>
d.score>.10&&d.bbox[2]*d.bbox[3]/imageArea>.018
);
if(personLikely||objs.length<2)continue;

return{img,objs,page:info.descriptionurl};
}catch(e){console.debug("Trying another photo",e)}
}
throw Error("Couldn't find a suitable object-only photo. Please try again.");
}

function loc(d,img){
const x=(d.bbox[0]+d.bbox[2]/2)/img.naturalWidth;
const y=(d.bbox[1]+d.bbox[3]/2)/img.naturalHeight;
return{
x,y,
text:(y<.33?"top":y>.67?"bottom":"middle")+" "+
(x<.33?"left":x>.67?"right":"centre")
};
}

async function makePuzzle(){
for(let attempt=0;attempt<3;attempt++){
const f=await getPhoto();
const objs=f.objs.filter(d=>!PEOPLE.test(d.class));
if(!objs.length)continue;

const type=round<2?"name":pick(["name","letter","small","large","name","letter"]);
let target,targets=[],prompt;

if(type==="small"||type==="large"){
const sorted=[...objs].sort((a,b)=>
a.bbox[2]*a.bbox[3]-b.bbox[2]*b.bbox[3]);
target=type==="small"?sorted[0]:sorted[sorted.length-1];
targets=[target];
prompt="Find the "+(type==="small"?"SMALLEST":"LARGEST")+" detected object.";
}else{
target=pick(objs);
targets=objs.filter(d=>type==="name"?d.class===target.class:d.class[0]===target.class[0]);
prompt=type==="name"?"Find the "+target.class+".":"Find an object starting with ‘"+target.class[0].toUpperCase()+"’.";
}

const p=loc(target,f.img);
const clues=[
"Look in the "+p.text+" of the picture.",
"The AI labels the target as ‘"+target.class+"’.",
"Its box is about "+Math.round(target.bbox[2]/f.img.naturalWidth*100)+"% of the image width."
];
return{...f,target,targets,prompt,clues,answer:target.class};
}
throw Error("Couldn't make a puzzle");
}

function say(main,sub=""){
$("say").textContent=main;
$("clue").textContent=sub;
}
function paint(){
$("score").textContent=score;
$("streak").textContent=streak;
$("best").textContent=best;
}
function busy(on){
locked=on;
$("hint").disabled=on;
$("skip").disabled=on;
}

async function next(){
busy(true);
current=null;
hints=0;
$("err").textContent="";
$("next").classList.add("hidden");
$("skip").classList.remove("hidden");
$("hint").classList.remove("hidden");
$("game").classList.remove("hidden");
$("stage").innerHTML='<div class="load">Spyro is checking for people and searching for objects…</div>';

try{
const p=await makePuzzle();
current=p;
locked=false;
$("stage").innerHTML="";
$("stage").appendChild(p.img);

const ov=document.createElement("div");
ov.className="overlay";
ov.onclick=click;
$("stage").appendChild(ov);

$("credit").innerHTML='Photo: <a href="'+p.page+'" target="_blank" rel="noopener">Wikimedia Commons</a>';
say(p.prompt,"Click the object. Use Hint if you need help.");
busy(false);
}catch(e){
$("stage").innerHTML='<div class="load">No suitable photo found. Try again.</div>';
$("err").textContent=e.message;
say("I couldn't find a good object-only photo.","Press Next picture to retry.");
$("skip").classList.add("hidden");
$("next").classList.remove("hidden");
busy(false);
}
}

function mark(x,y,good){
const el=document.createElement("div");
el.className="mark";
el.textContent=good?"✓":"✕";
el.style.left=x/current.img.naturalWidth*100+"%";
el.style.top=y/current.img.naturalHeight*100+"%";
$("stage").appendChild(el);
}

function reveal(){
const ov=$("stage").querySelector(".overlay");
for(const d of current.targets){
const b=document.createElement("div");
b.className="box";
b.style.left=d.bbox[0]/current.img.naturalWidth*100+"%";
b.style.top=d.bbox[1]/current.img.naturalHeight*100+"%";
b.style.width=d.bbox[2]/current.img.naturalWidth*100+"%";
b.style.height=d.bbox[3]/current.img.naturalHeight*100+"%";
const label=document.createElement("span");
label.textContent=d.class;
b.appendChild(label);
ov.appendChild(b);
}
ov.style.pointerEvents="none";
}

function finish(ok){
locked=true;
if(ok){
const pts=Math.max(3,12-hints*2)*Math.min(4,1+streak*.25);
score+=Math.round(pts);
streak++;
if(score>best){
best=score;
try{localStorage.setItem("ispy-best",best)}catch(e){}
}
say("Correct! You found the "+current.answer+". +"+Math.round(pts)+" points!","Great spotting.");
}else{
streak=0;
say("The target was "+current.answer+". Study the highlighted box, then try another picture.");
}
reveal();
$("hint").classList.add("hidden");
$("skip").classList.add("hidden");
$("next").classList.remove("hidden");
paint();
}

function click(e){
if(locked||!current)return;
const r=$("stage").getBoundingClientRect();
const x=(e.clientX-r.left)*current.img.naturalWidth/r.width;
const y=(e.clientY-r.top)*current.img.naturalHeight/r.height;
const hit=current.targets.some(d=>
x>=d.bbox[0]-8&&x<=d.bbox[0]+d.bbox[2]+8&&
y>=d.bbox[1]-8&&y<=d.bbox[1]+d.bbox[3]+8
);
mark(x,y,hit);
if(hit)finish(true);
else say("Not quite — look carefully.","Try another object.");
}

$("start").onclick=async()=>{
score=0;streak=0;round=0;paint();
$("startrow").classList.add("hidden");
await next();
};
$("next").onclick=async()=>{
round++;
$("hint").classList.remove("hidden");
await next();
};
$("skip").onclick=()=>{if(!locked&&current)finish(false)};
$("hint").onclick=()=>{
if(locked||!current)return;
if(hints<current.clues.length){
say("Hint: "+current.clues[hints++],"Hints reduce points for this puzzle.");
}
if(hints>=current.clues.length)$("hint").disabled=true;
};
paint();
</script>
</body>
</html>
